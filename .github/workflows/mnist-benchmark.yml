name: MNIST benchmark

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Number of training epochs"
        required: true
        default: "3"
        type: string
      batch_size:
        description: "Mini-batch size"
        required: true
        default: "128"
        type: string
      limit_train:
        description: "Training samples (0 = all 60,000)"
        required: true
        default: "0"
        type: string
      limit_test:
        description: "Test samples (0 = all 10,000)"
        required: true
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  train-mnist:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install AstraTensor
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pybind11
      - name: Build native C backend
        run: python setup.py build_ext --inplace --force
      - name: Train and evaluate on MNIST
        env:
          EPOCHS: ${{ inputs.epochs }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          LIMIT_TRAIN: ${{ inputs.limit_train }}
          LIMIT_TEST: ${{ inputs.limit_test }}
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          args=(--epochs "$EPOCHS" --batch-size "$BATCH_SIZE")
          if [[ "$LIMIT_TRAIN" != "0" ]]; then
            args+=(--limit-train "$LIMIT_TRAIN")
          fi
          if [[ "$LIMIT_TEST" != "0" ]]; then
            args+=(--limit-test "$LIMIT_TEST")
          fi
          {
            echo "AstraTensor MNIST benchmark"
            echo "Commit: $GITHUB_SHA"
            echo "Epochs: $EPOCHS"
            echo "Batch size: $BATCH_SIZE"
            echo "Training limit: $LIMIT_TRAIN (0 means full dataset)"
            echo "Test limit: $LIMIT_TEST (0 means full dataset)"
            echo
            python examples/train_mnist.py "${args[@]}"
          } 2>&1 | tee benchmark-results/mnist-results.txt
      - name: Profile native matrix multiplication boundary
        run: |
          set -euo pipefail
          python examples/benchmark_matmul_boundary.py --batch-size 128 --repeats 30 2>&1 | tee benchmark-results/matmul-boundary-results.txt
      - name: Install PyTorch CPU benchmark oracle
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compare AstraTensor with PyTorch on MNIST
        env:
          EPOCHS: ${{ inputs.epochs }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          LIMIT_TRAIN: ${{ inputs.limit_train }}
          LIMIT_TEST: ${{ inputs.limit_test }}
        run: |
          set -euo pipefail
          args=(--epochs "$EPOCHS" --batch-size "$BATCH_SIZE")
          if [[ "$LIMIT_TRAIN" != "0" ]]; then
            args+=(--limit-train "$LIMIT_TRAIN")
          fi
          if [[ "$LIMIT_TEST" != "0" ]]; then
            args+=(--limit-test "$LIMIT_TEST")
          fi
          python examples/compare_mnist.py "${args[@]}" 2>&1 | tee benchmark-results/comparison-results.txt
      - name: Upload training metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astratensor-mnist-results
          path: benchmark-results/*.txt
          if-no-files-found: ignore
          retention-days: 30
