name: AstraTensor CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pybind11 pytest build
      - name: Build native extension
        run: python setup.py build_ext --inplace --force
      - name: Build source distribution and wheel
        run: python -m build
      - name: Run unit tests
        run: python -m pytest -q
      - name: Run XOR training example
        run: python examples/train_xor.py
      - name: Run nonlinear synthetic classification benchmark
        run: python examples/train_synthetic.py
      - name: Run MNIST pipeline smoke test
        run: python examples/train_mnist.py --smoke-test

  pytorch-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install PyTorch CPU oracle and framework
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
          python -m pip install pybind11 pytest
      - name: Build native extension
        run: python setup.py build_ext --inplace --force
      - name: Compare AstraTensor forward passes and gradients with PyTorch
        run: python -m pytest -q tests/test_torch_parity.py
