name: OddlyTyped CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pybind11 pytest build
      - name: Build native extension
        run: python setup.py build_ext --inplace --force
      - name: Build source distribution and wheel
        run: python -m build
      - name: Install and smoke-test built wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/oddlytyped-wheel-env"
          "$RUNNER_TEMP/oddlytyped-wheel-env/bin/python" -m pip install "numpy>=1.23"
          "$RUNNER_TEMP/oddlytyped-wheel-env/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/oddlytyped-wheel-env/bin/python" -c 'import numpy as np; import oddlytyped; from oddlytyped.backend import matmul; actual = matmul(np.array([[1.0, 2.0]]), np.array([[3.0], [4.0]])); assert np.array_equal(actual, np.array([[11.0]])), actual; print("Installed wheel import and native matrix multiplication passed.")'
      - name: Rebuild and smoke-test wheel from source distribution
        run: |
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/sdist-wheel" dist/*.tar.gz
          "$RUNNER_TEMP/oddlytyped-wheel-env/bin/python" -m pip install --no-deps --force-reinstall "$RUNNER_TEMP"/sdist-wheel/*.whl
          "$RUNNER_TEMP/oddlytyped-wheel-env/bin/python" -c 'import numpy as np; import oddlytyped; from oddlytyped.backend import matmul; actual = matmul(np.array([[1.0, 2.0]]), np.array([[3.0], [4.0]])); assert np.array_equal(actual, np.array([[11.0]])), actual; print("Source-distribution rebuild, install, and native matrix multiplication passed.")'
      - name: Run unit tests
        run: python -m pytest -q
      - name: Run XOR training example
        run: python examples/train_xor.py
      - name: Run nonlinear synthetic classification benchmark
        run: python examples/train_synthetic.py
      - name: Run MNIST pipeline smoke test
        run: python examples/train_mnist.py --smoke-test

  pytorch-parity:
    needs: test
    if: ${{ always() && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install PyTorch CPU oracle and framework
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
          python -m pip install pybind11 pytest
      - name: Build native extension
        run: python setup.py build_ext --inplace --force
      - name: Compare OddlyTyped forward passes and gradients with PyTorch
        run: python -m pytest -q tests/test_torch_parity.py
